<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<title>河传答哒 桌宠</title>
<style>
/* 桌宠窗口：透明、无边框、总在最前。平时只有小日历本身那么大，弹出气泡时主进程把窗口撑大。
   --s 是大小倍数（设置里选小 / 中 / 大），画面按 130×140 设计再整体缩放 */
:root{
  --s:.72;
  --panel:#ffffff; --text:#1f1e1b; --sub:#5f5c55; --muted:#97938a; --line:#e6e2d7; --hover:#f3f1ea;
  --accent:#c6613f; --accent-ink:#fff;
  --shadow:0 1px 4px rgba(40,35,20,.08),0 6px 16px rgba(40,35,20,.14);
  --sans:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --panel:#30302e; --text:#f0eee6; --sub:#bcb9ae; --muted:#8b887f; --line:#45443f; --hover:#3a3936;
  --accent:#d97757;
  --shadow:0 1px 4px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root[data-theme="system"]{
    --panel:#30302e; --text:#f0eee6; --sub:#bcb9ae; --muted:#8b887f; --line:#45443f; --hover:#3a3936;
    --accent:#d97757;
    --shadow:0 1px 4px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font:13px/1.5 var(--sans);color:var(--text);user-select:none}

/* ---------- 小日历 ---------- */
#petBox{position:absolute;left:0;top:0;width:calc(130px * var(--s));height:calc(140px * var(--s));cursor:grab}
#petBox:active{cursor:grabbing}
svg{display:block;width:100%;height:100%;overflow:visible}
svg *{transform-box:view-box}
.bob{animation:bob 3.2s ease-in-out infinite;transform-origin:65px 128px}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(1.012,.988)}}
.shadow{transform-origin:65px 131px;animation:shadow 3.2s ease-in-out infinite}
@keyframes shadow{0%,100%{transform:scale(1)}50%{transform:scale(.92);opacity:.8}}
.body-g{transition:transform .3s cubic-bezier(.3,1.6,.5,1);transform-origin:65px 120px}
.ring{transition:transform .25s}
.ring.l{transform-origin:48px 40px}.ring.r{transform-origin:82px 40px}
.arm{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.arm.l{transform-origin:26px 84px}.arm.r{transform-origin:104px 84px}
.feet{transition:transform .3s}
.ribbon{transform-origin:88px 36px;animation:sway 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
.look{transition:transform .18s ease-out}
.eyeball{transform-box:fill-box;transform-origin:center;transition:transform .08s}
.blink [data-e=open] .eyeball,.blink [data-e=wink] .eyeball{transform:scaleY(.1)}

/* 表情的零件：眼睛、嘴、特效各有好几种，JS 按表情把要用的那几个加上 .on */
[data-e],[data-m],[data-fx]{display:none}
[data-e].on,[data-m].on,[data-fx].on{display:inline}
.m-yawn{transform-box:fill-box;transform-origin:center;animation:yawn 1.8s ease-in-out}
@keyframes yawn{0%{transform:scaleY(.2)}35%,70%{transform:scaleY(1)}100%{transform:scaleY(.3)}}
.m-chew{transform-box:fill-box;transform-origin:center;animation:chew .35s ease-in-out infinite alternate}
@keyframes chew{from{transform:scale(1,.4)}to{transform:scale(1,1)}}
.spiral{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.e-heart{transform-box:fill-box;transform-origin:center;animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(.9)}to{transform:scale(1.12)}}
.dots circle{animation:dot 1.2s ease-in-out infinite}
.dots circle:nth-child(2){animation-delay:.2s}.dots circle:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.spark{animation:twinkle 1s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
.z{font:800 10px "Segoe UI",sans-serif;fill:#8EA0D8;opacity:0;animation:zz 2.7s ease-in-out infinite}
.z2{font-size:12px;animation-delay:.9s}.z3{font-size:14px;animation-delay:1.8s}
@keyframes zz{0%{opacity:0;transform:translate(0,5px)}25%{opacity:1}100%{opacity:0;transform:translate(7px,-7px)}}
.nt{font:700 13px "Segoe UI Symbol","Segoe UI",sans-serif;fill:#F58A2E;animation:note 1.8s ease-in-out infinite}
.nt.n2{fill:#6FA2FF;animation-delay:.9s}
@keyframes note{0%{opacity:0;transform:translate(0,4px)}30%{opacity:1}100%{opacity:0;transform:translate(3px,-12px) rotate(10deg)}}
.fh{animation:heartUp 1.6s ease-out infinite}
.fh.h2{animation-delay:.8s}
@keyframes heartUp{0%{opacity:0;transform:translateY(4px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translateY(-14px) scale(1.1)}}
.pop{font:900 20px "Segoe UI",sans-serif;animation:popIn .4s cubic-bezier(.3,1.8,.5,1)}
@keyframes popIn{from{transform:translateY(6px) scale(.3);opacity:0}to{transform:none;opacity:1}}
.steam path{animation:steam 1.6s ease-in-out infinite}
.steam path+path{animation-delay:.8s}
@keyframes steam{0%{opacity:0;transform:translateY(3px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-6px)}}

/* 姿势 */
.p-tilt .body-g{transform:rotate(-5deg)}
.p-reach .body-g{transform:scale(1.08)}
.p-reach .arm.l{transform:rotate(-70deg)}.p-reach .arm.r{transform:rotate(70deg)}
.p-reach .ring.l{transform:rotate(-14deg)}.p-reach .ring.r{transform:rotate(14deg)}
/* 举手：手臂在身体后面，往外挪一点再转上去，才露得出来 */
.p-cheer .arm.l,.p-stretch .arm.l,.p-dangle .arm.l,.p-jump .arm.l{transform:translate(-7px,-2px) rotate(145deg)}
.p-cheer .arm.r,.p-stretch .arm.r,.p-dangle .arm.r,.p-jump .arm.r{transform:translate(7px,-2px) rotate(-145deg)}
.p-cheer .bob{animation:hop .55s ease-out 2}
.p-jump .bob{animation:hop .5s ease-out 1}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px) scale(.97,1.04)}70%{transform:translateY(0) scale(1.05,.95)}}
.p-stretch .body-g{transform:scale(.96,1.07)}
.p-think .ring.l{animation:wig .5s ease-in-out infinite alternate}
.p-think .ring.r{animation:wig .5s ease-in-out infinite alternate-reverse}
@keyframes wig{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
.p-droop .ring.l{transform:rotate(16deg)}.p-droop .ring.r{transform:rotate(-16deg)}
.p-droop .body-g{transform:translateY(2px) scale(1,.98)}
.p-sway .body-g{animation:sway2 2.6s ease-in-out infinite}
@keyframes sway2{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.p-sleep .bob{animation:breathe 4.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.965)}}
.p-sleep .body-g{transform:translateY(3px)}
.p-sleep .ring.l{transform:rotate(22deg)}.p-sleep .ring.r{transform:rotate(-22deg)}
.p-wave .arm.r{animation:wave .42s ease-in-out infinite alternate}
@keyframes wave{from{transform:translate(7px,-2px) rotate(-110deg)}to{transform:translate(7px,-3px) rotate(-160deg)}}
.p-wobble .body-g{animation:wob .38s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.p-squish .body-g{transform:scale(1.12,.86);transition-duration:.12s}
.p-dangle .body-g{transform-origin:65px 26px;animation:swing 1.1s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.p-dangle .feet{transform:translateY(3px)}
.p-dangle .shadow{opacity:.35}
.p-shiver .body-g{animation:shiver .09s linear infinite alternate}
@keyframes shiver{from{transform:translateX(-.8px)}to{transform:translateX(.8px)}}

/* ---------- 气泡 ---------- */
#bubble{position:absolute;left:0;width:280px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;visibility:hidden;cursor:default}
#bubble.on{visibility:visible;animation:bpop .18s ease-out}
@keyframes bpop{from{opacity:0;transform:translateY(var(--from,6px)) scale(.97)}to{opacity:1;transform:none}}
.b-h{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.b-h b{flex:1;font-size:13.5px}
.x{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:0 2px;cursor:pointer;border-radius:4px}
.x:hover{color:var(--text);background:var(--hover)}
.hint{color:var(--muted);font-size:12px;margin:0}
.status{font-size:12.5px;color:var(--sub);background:var(--hover);border-radius:8px;padding:6px 9px;margin:0 0 8px}
.status b{color:var(--text);font-weight:600}
.menu{display:flex;flex-direction:column;gap:2px;margin:4px -6px -4px}
.menu button{all:unset;padding:7px 8px;border-radius:8px;cursor:pointer;color:var(--text)}
.menu button:hover{background:var(--hover)}
.menu button.dim{color:var(--muted)}
.list{max-height:216px;overflow:auto;margin:0 -6px;padding:0 6px}
.item{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item input{margin:3px 0 0;accent-color:var(--accent)}
.item .t{font-weight:500;word-break:break-all}
.item .w{color:var(--sub);font-size:12px}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;margin-left:4px;background:var(--hover);color:var(--sub);vertical-align:1px}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{flex:1;font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer}
.acts button:hover{background:var(--hover)}
.acts button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.acts button.primary:hover{filter:brightness(1.06)}
.list::-webkit-scrollbar{width:6px}.list::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
</style>
</head>
<body>
<div id="bubble"></div>
<div id="petBox" title="单击打开菜单 · 双击摸摸头 · 按住可以拖动 · 把聊天文字拖给我">
<svg id="pet" viewBox="0 0 130 140" aria-label="河传答哒">
  <defs>
    <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC98A"/><stop offset=".45" stop-color="#FF9A3D"/><stop offset="1" stop-color="#F2711C"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8DB6FF"/><stop offset="1" stop-color="#4A7BE8"/>
    </linearGradient>
    <linearGradient id="gYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE7A3"/><stop offset="1" stop-color="#FFB547"/>
    </linearGradient>
    <clipPath id="clipBody"><rect x="24" y="34" width="82" height="86" rx="22"/></clipPath>
    <path id="star" d="M0 -4 l1.2 2.8 l3 .3 l-2.3 2 l.7 3 l-2.6 -1.6 l-2.6 1.6 l.7 -3 l-2.3 -2 l3 -.3 z"/>
    <path id="hrt" d="M0 4 C-5 0 -6 -4 -3 -5.5 C-1.3 -6.3 0 -5 0 -3.8 C0 -5 1.3 -6.3 3 -5.5 C6 -4 5 0 0 4 Z"/>
  </defs>
  <ellipse class="shadow" cx="65" cy="132" rx="34" ry="5" fill="rgba(0,0,0,.18)"/>
  <g class="bob">
    <g class="feet">
      <ellipse cx="50" cy="122" rx="9" ry="5.5" fill="#D9600F"/>
      <ellipse cx="80" cy="122" rx="9" ry="5.5" fill="#D9600F"/>
    </g>
    <g class="body-g">
      <!-- 图标里后面那两层：蓝色和黄色的卡片，像小披风 -->
      <rect x="14" y="40" width="62" height="70" rx="18" fill="url(#gBlue)" opacity=".85" transform="rotate(-10 45 75)"/>
      <rect x="56" y="34" width="62" height="70" rx="18" fill="url(#gYellow)" opacity=".85" transform="rotate(9 87 69)"/>
      <g class="arm l"><ellipse cx="21" cy="92" rx="6.5" ry="10.5" fill="#E8701A"/></g>
      <g class="arm r"><ellipse cx="109" cy="92" rx="6.5" ry="10.5" fill="#E8701A"/></g>
      <!-- 身体：橙色的日历本 -->
      <rect x="24" y="34" width="82" height="86" rx="22" fill="url(#gBody)"/>
      <g clip-path="url(#clipBody)">
        <path class="ribbon" d="M82 34 h13 v40 l-6.5 -6 l-6.5 6 z" fill="#FFF4E8" opacity=".85"/>
        <rect x="24" y="34" width="82" height="22" fill="#fff" opacity=".14"/>
      </g>
      <path d="M33 52 q1-9 11-10" stroke="#fff" stroke-opacity=".6" stroke-width="4" stroke-linecap="round" fill="none"/>
      <!-- 两个铁环，像头上的小发夹 -->
      <g class="ring l"><rect x="43.5" y="22" width="9" height="24" rx="4.5" fill="#3b3330"/><rect x="46" y="25" width="2.6" height="8" rx="1.3" fill="#fff" opacity=".35"/></g>
      <g class="ring r"><rect x="77.5" y="22" width="9" height="24" rx="4.5" fill="#3b3330"/><rect x="80" y="25" width="2.6" height="8" rx="1.3" fill="#fff" opacity=".35"/></g>
      <!-- 脸 -->
      <g class="face" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="38" cy="88" rx="6" ry="3.6" fill="#FF6B6B" opacity=".35"/>
        <ellipse cx="74" cy="88" rx="6" ry="3.6" fill="#FF6B6B" opacity=".35"/>
        <g class="eyes">
          <g data-e="open"><g class="look">
            <g class="eyeball"><ellipse cx="45" cy="77" rx="4.6" ry="6" fill="#2b2420"/><circle cx="46.6" cy="74.6" r="1.7" fill="#fff"/></g>
            <g class="eyeball"><ellipse cx="67" cy="77" rx="4.6" ry="6" fill="#2b2420"/><circle cx="68.6" cy="74.6" r="1.7" fill="#fff"/></g>
          </g></g>
          <g data-e="wide">
            <ellipse cx="45" cy="76" rx="5.6" ry="7.2" fill="#2b2420"/><circle cx="47" cy="73.2" r="2.1" fill="#fff"/><circle cx="43.4" cy="79.2" r=".9" fill="#fff"/>
            <ellipse cx="67" cy="76" rx="5.6" ry="7.2" fill="#2b2420"/><circle cx="69" cy="73.2" r="2.1" fill="#fff"/><circle cx="65.4" cy="79.2" r=".9" fill="#fff"/>
          </g>
          <g data-e="half">
            <path d="M40.4 76.5 a4.6 5 0 0 0 9.2 0 z M62.4 76.5 a4.6 5 0 0 0 9.2 0 z" fill="#2b2420"/>
            <path d="M39.2 76.5 h11.6 M61.2 76.5 h11.6" stroke="#2b2420" stroke-width="2"/>
          </g>
          <path data-e="happy" d="M40 79 q5 -7 10 0 M62 79 q5 -7 10 0" stroke="#2b2420" stroke-width="2.6" fill="none"/>
          <path data-e="shut" d="M40 77 q5 4 10 0 M62 77 q5 4 10 0" stroke="#2b2420" stroke-width="2.6" fill="none"/>
          <g data-e="spiral" stroke="#2b2420" stroke-width="1.6" fill="none">
            <path class="spiral" d="M45 77 m0 -1 a1 1 0 1 1 -1 1 a2 2 0 1 1 2 2 a3 3 0 1 1 -3 -3 a4 4 0 1 1 4 4"/>
            <path class="spiral" d="M67 77 m0 -1 a1 1 0 1 1 -1 1 a2 2 0 1 1 2 2 a3 3 0 1 1 -3 -3 a4 4 0 1 1 4 4"/>
          </g>
          <g data-e="heart" fill="#FF5A6E">
            <!-- 动画的 transform 会盖掉 transform 属性，所以位置放在外面一层 -->
            <g transform="translate(45 77) scale(1.15)"><use class="e-heart" href="#hrt"/></g>
            <g transform="translate(67 77) scale(1.15)"><use class="e-heart" href="#hrt"/></g>
          </g>
          <path data-e="x" d="M41 73 l8 4 l-8 4 M71 73 l-8 4 l8 4" stroke="#2b2420" stroke-width="2.4" fill="none"/>
          <g data-e="wink">
            <g class="eyeball"><ellipse cx="45" cy="77" rx="4.6" ry="6" fill="#2b2420"/><circle cx="46.6" cy="74.6" r="1.7" fill="#fff"/></g>
            <path d="M62 78 q5 -6 10 0" stroke="#2b2420" stroke-width="2.6" fill="none"/>
          </g>
        </g>
        <g class="mouth">
          <path data-m="smile" d="M51 88 q5 5 10 0" stroke="#2b2420" stroke-width="2.4" fill="none"/>
          <path data-m="grin" d="M50 87 h12 q0 8 -6 8 q-6 0 -6 -8 z" fill="#2b2420"/>
          <ellipse data-m="o" cx="56" cy="91" rx="5" ry="6" fill="#2b2420"/>
          <ellipse data-m="small" cx="56" cy="90" rx="2.4" ry="2" fill="#2b2420"/>
          <path data-m="wave" d="M50 92 q3 -3 6 0 q3 3 6 0" stroke="#2b2420" stroke-width="2.2" fill="none"/>
          <ellipse data-m="yawn" class="m-yawn" cx="56" cy="92" rx="5.5" ry="7" fill="#2b2420"/>
          <path data-m="cat" d="M50 88 q3 4 6 0 q3 4 6 0" stroke="#2b2420" stroke-width="2.2" fill="none"/>
          <ellipse data-m="chew" class="m-chew" cx="56" cy="90" rx="3.4" ry="2.6" fill="#2b2420"/>
          <path data-m="flat" d="M52 90 h8" stroke="#2b2420" stroke-width="2.4"/>
        </g>
      </g>
      <!-- 端着的小碗（午饭时间） -->
      <g data-fx="bowl">
        <g class="steam" stroke="#fff" stroke-width="1.6" fill="none" opacity=".8"><path d="M50 99 q-2 -3 0 -6 q2 -3 0 -6"/><path d="M62 99 q-2 -3 0 -6 q2 -3 0 -6"/></g>
        <ellipse cx="56" cy="103.5" rx="11.5" ry="3" fill="#fff"/>
        <path d="M44 103.5 h24 a12 10 0 0 1 -24 0 z" fill="#4A7BE8"/>
        <path d="M47.5 107 h17" stroke="#8DB6FF" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="44" cy="108" r="4.6" fill="#E8701A"/><circle cx="68" cy="108" r="4.6" fill="#E8701A"/>
      </g>
    </g>
    <!-- 头顶和身边的特效 -->
    <g class="fx">
      <g data-fx="dots" class="dots"><circle cx="54" cy="10" r="3" fill="#F58A2E"/><circle cx="65" cy="10" r="3" fill="#F58A2E"/><circle cx="76" cy="10" r="3" fill="#F58A2E"/></g>
      <g data-fx="spark">
        <path class="spark" d="M16 30 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z" fill="#FFC24D"/>
        <path class="spark" d="M112 22 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5 l4 -1.5 z" fill="#FFC24D" style="animation-delay:.4s"/>
      </g>
      <path data-fx="sweat" d="M100 46 q-5 8 0 10 q5 -2 0 -10 z" fill="#8DC4FF"/>
      <g data-fx="zzz"><text class="z" x="96" y="34">z</text><text class="z z2" x="103" y="24">z</text><text class="z z3" x="110" y="13">Z</text></g>
      <g data-fx="notes"><text class="nt" x="101" y="34">♪</text><text class="nt n2" x="14" y="40">♫</text></g>
      <g data-fx="heart" fill="#FF5A6E"><g transform="translate(104 30)"><use class="fh" href="#hrt"/></g><g transform="translate(22 36) scale(.8)"><use class="fh h2" href="#hrt"/></g></g>
      <g data-fx="stars" fill="#FFC24D"><g transform="translate(65 24) scale(1 .38)"><g>
        <use href="#star" transform="translate(20 0) scale(1 2.6)"/><use href="#star" transform="translate(-20 0) scale(1 2.6)"/><use href="#star" transform="translate(0 20) scale(1 2.6)"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      </g></g></g>
      <text data-fx="excl" class="pop" x="104" y="32" fill="#FF6A3D">!</text>
      <text data-fx="q" class="pop" x="103" y="32" fill="#6FA2FF">?</text>
      <g data-fx="sun" transform="translate(113 15)">
        <circle r="4.6" fill="#FFC24D"/>
        <g stroke="#FFC24D" stroke-width="1.6" stroke-linecap="round"><path d="M0 -8 v-2.5 M0 8 v2.5 M-8 0 h-2.5 M8 0 h2.5 M5.7 5.7 l1.8 1.8 M-5.7 -5.7 l-1.8 -1.8 M5.7 -5.7 l1.8 -1.8 M-5.7 5.7 l-1.8 1.8"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/></g>
      </g>
      <path data-fx="moon" d="M112 6 a7.5 7.5 0 1 0 6.5 11.5 a6 6 0 1 1 -6.5 -11.5 z" fill="#FFD86B"/>
    </g>
  </g>
</svg>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const petEl = $('#pet'), box = $('#petBox'), bubble = $('#bubble');
const TYPE_NAME = { task: '作业/考试', event: '活动', other: '其他' };
const SCALE = +new URLSearchParams(location.search).get('s') || .72;
document.documentElement.style.setProperty('--s', SCALE);
const PH = Math.round(140 * SCALE);  // 小日历的高度（窗口里）
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

/* ========== 表情 ==========
   e 眼睛 / m 嘴 / fx 特效（空格分开可以多个）/ p 姿势 */
const FACES = {
  idle:    { e: 'open', m: 'smile' },
  hover:   { e: 'open', m: 'smile', p: 'tilt' },
  eat:     { e: 'wide', m: 'o', fx: 'spark', p: 'reach' },        // 拖着文字过来
  think:   { e: 'shut', m: 'small', fx: 'dots', p: 'think' },      // 识别中
  happy:   { e: 'happy', m: 'grin', fx: 'spark', p: 'cheer' },
  sad:     { e: 'open', m: 'wave', fx: 'sweat', p: 'droop' },
  sleepy:  { e: 'half', m: 'small', p: 'sway' },                   // 白天太久没人理：打瞌睡
  night:   { e: 'half', m: 'small', fx: 'moon', p: 'sway' },       // 夜里还醒着
  asleep:  { e: 'shut', m: 'small', fx: 'zzz moon', p: 'sleep' },  // 半夜：睡着了
  yawn:    { e: 'shut', m: 'yawn', p: 'stretch' },
  stretch: { e: 'happy', m: 'o', p: 'stretch' },
  wave:    { e: 'open', m: 'grin', p: 'wave' },
  look:    { e: 'open', m: 'small' },
  hum:     { e: 'shut', m: 'cat', fx: 'notes', p: 'sway' },
  love:    { e: 'heart', m: 'grin', fx: 'heart', p: 'cheer' },
  dizzy:   { e: 'spiral', m: 'wave', fx: 'stars', p: 'wobble' },
  poke:    { e: 'x', m: 'flat', p: 'squish' },
  boop:    { e: 'happy', m: 'o', p: 'squish' },
  dangle:  { e: 'wide', m: 'o', p: 'dangle' },                     // 被拎起来
  alert:   { e: 'wide', m: 'o', fx: 'excl', p: 'jump' },           // 到点提醒
  lunch:   { e: 'happy', m: 'chew', fx: 'bowl' },
  wink:    { e: 'wink', m: 'grin', fx: 'spark' },
  nervous: { e: 'open', m: 'wave', fx: 'sweat', p: 'shiver' },     // 今天还有没交的
  curious: { e: 'open', m: 'small', fx: 'q', p: 'tilt' },
  morning: { e: 'happy', m: 'grin', fx: 'sun', p: 'wave' }
};
let shown = '';
function applyFace(name) {
  if (name === shown) return;
  shown = name;
  const f = FACES[name] || FACES.idle, fx = (f.fx || '').split(' ');
  petEl.querySelectorAll('[data-e]').forEach(el => el.classList.toggle('on', el.dataset.e === f.e));
  petEl.querySelectorAll('[data-m]').forEach(el => el.classList.toggle('on', el.dataset.m === f.m));
  petEl.querySelectorAll('[data-fx]').forEach(el => el.classList.toggle('on', fx.includes(el.dataset.fx)));
  petEl.setAttribute('class', f.p ? 'p-' + f.p : '');
  if (f.e !== 'open') lookTo(0, 0);
}

/* ========== 状态 ==========
   优先级：识别相关（eat / think）> 被拎着 > 一次性动作 > 鼠标放上去 > 按时间的基本状态 */
let mode = '', dragging = false, hover = false, action = '', actTimer = 0, lastTouch = Date.now(), st = null;
function baseState() {
  const d = new Date(), h = d.getHours(), m = d.getMinutes(), recent = Date.now() - lastTouch < 90e3;
  if (h < 6) return recent ? 'night' : 'asleep';
  if (h >= 23 || (h === 22 && m >= 30)) return 'night';
  if (Date.now() - lastTouch > 20 * 60e3 && !bubbleKind) return 'sleepy';
  return 'idle';
}
function render() {
  const b = baseState();
  applyFace(mode || (dragging && 'dangle') || action || (hover && b === 'idle' ? 'hover' : b));
}
function act(name, ms) {
  clearTimeout(actTimer);
  action = name;
  render();
  actTimer = setTimeout(() => { action = ''; render(); }, ms);
  if (name === 'look') scan();
}
function setMode(m) { mode = m; render(); }
const touch = () => { lastTouch = Date.now(); };

// 眼睛跟着鼠标转（主进程每隔一会儿发来鼠标相对小日历的位置）
const look = petEl.querySelector('.look');
let scanning = false;
function lookTo(x, y) { look.style.transform = `translate(${x}px,${y}px)`; }
window.pet.onCursor(({ dx, dy }) => {
  if (scanning || dragging) return;
  const d = Math.hypot(dx, dy);
  if (d > 900 || d < 1) return lookTo(0, 0);
  const k = Math.min(1, d / 120) * 1.9;
  lookTo(dx / d * k, dy / d * k * .8);
});
// 东张西望
function scan() {
  scanning = true;
  lookTo(-1.9, 0);
  setTimeout(() => lookTo(1.9, -.4), 650);
  setTimeout(() => lookTo(0, -1.4), 1300);
  setTimeout(() => { scanning = false; lookTo(0, 0); }, 2000);
}
// 眨眼：偶尔连眨两下
(function blink() {
  setTimeout(() => {
    const once = () => { petEl.classList.add('blink'); setTimeout(() => petEl.classList.remove('blink'), 130); };
    once();
    if (Math.random() < .25) setTimeout(once, 260);
    blink();
  }, 2400 + Math.random() * 3800);
})();

/* 闲着的时候自己找点事做：按时间和今天的安排挑一个小动作 */
const ACT_MS = { look: 2100, hum: 3600, stretch: 1800, wave: 2000, wink: 900, curious: 1800, lunch: 4200, nervous: 2400, yawn: 1800 };
function pickIdle() {
  const d = new Date(), h = d.getHours(), hm = h * 60 + d.getMinutes(), b = baseState();
  if (b === 'asleep') return '';
  if (b === 'night' || b === 'sleepy') return Math.random() < .55 ? 'yawn' : 'look';
  const w = [['look', 30], ['hum', 10], ['stretch', h >= 6 && h < 10 ? 18 : 6], ['wave', 5], ['wink', 5], ['curious', 5]];
  if (hm >= 690 && hm <= 780) w.push(['lunch', 30]);           // 11:30 – 13:00
  if (hm >= 1050 && hm <= 1140) w.push(['lunch', 12]);          // 17:30 – 19:00 晚饭
  if (h >= 21) w.push(['yawn', 16]);
  if (st && st.dueToday && h >= 17) w.push(['nervous', 14]);
  let r = Math.random() * w.reduce((s, x) => s + x[1], 0);
  for (const [n, k] of w) if ((r -= k) < 0) return n;
  return 'look';
}
(function idleLoop() {
  setTimeout(() => {
    if (!mode && !dragging && !action && !hover && !bubbleKind) { const a = pickIdle(); if (a) act(a, ACT_MS[a]); }
    idleLoop();
  }, 14000 + Math.random() * 18000);
})();

/* ========== 和时间、课表有关的话 ========== */
const today = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
const minsTo = hm => { if (!hm) return NaN; const [h, m] = hm.split(':').map(Number), n = new Date(); return h * 60 + m - (n.getHours() * 60 + n.getMinutes()); };
function statusHtml() {
  if (!st) return '';
  const parts = [];
  if (st.cur) parts.push(`正在上 <b>${esc(st.cur.title)}</b>${st.cur.room ? ' · ' + esc(st.cur.room) : ''}，${esc(st.cur.end)} 下课`);
  else if (st.next && st.next.isToday) { const m = minsTo(st.next.start); parts.push(`下节课 <b>${esc(st.next.title)}</b> ${esc(st.next.start)}${st.next.room ? ' · ' + esc(st.next.room) : ''}${m > 0 ? `（${m < 60 ? m + ' 分钟' : Math.round(m / 6) / 10 + ' 小时'}后）` : ''}`); }
  else if (st.next) parts.push(`今天没课了，下节：${esc(st.next.when)} <b>${esc(st.next.title)}</b>`);
  if (st.dueToday) parts.push(`今天还有 <b>${st.dueToday}</b> 件要交`);
  return parts.length ? `<p class="status">${parts.join('<br>')}</p>` : '';
}
async function refreshStatus() {
  try { st = await window.pet.status(); } catch (e) {}
  greet();
}
function greet() {
  const d = new Date(), h = d.getHours(), b = baseState(), t = today();
  if (bubbleKind || mode || dragging) return;
  // 早上第一次见面
  if (h >= 5 && h < 11 && store.get('greet') !== t) {
    store.set('greet', t);
    act('morning', 2800);
    const first = st && st.firstCourse;
    return say(`早上好${st && st.name ? '，' + st.name : ''}！`, !st ? '' : st.todayCourses ? `今天有 ${st.todayCourses} 节课，第一节 ${first ? first.start + ' ' + first.title : ''}` : '今天没有课，安排一下自己的时间吧', null);
  }
  // 夜里第一次犯困
  if (b === 'night' && h >= 22 && store.get('night') !== t) {
    store.set('night', t);
    act('yawn', 1800);
    const tf = st && st.tomorrowFirst;
    return say('不早啦，早点睡～', tf ? `明天第一节：${tf.start} ${tf.title}` : '明天没有课，可以睡个懒觉', null);
  }
}
setInterval(() => { render(); refreshStatus(); }, 60e3);
window.pet.onRefresh(refreshStatus);
// 到点提醒（和 Windows 通知同时）：跳一下，冒个感叹号
window.pet.onAlert(({ title, body }) => {
  touch();
  act('alert', 3000);
  if (!bubbleKind || bubbleKind === 'say') say(title, body, null);
});

/* ---------- 气泡：先画出来量好高度，再让主进程把窗口撑大、告诉我们小日历放在哪 ---------- */
// 气泡四周多留一点，阴影才不会被窗口边缘切掉
const PAD = 24;
let bubbleKind = '';
async function showBubble(html, kind) {
  bubbleKind = kind;
  bubble.classList.remove('on');
  bubble.innerHTML = html;
  bubble.style.top = '0px';
  const L = await window.pet.layout({ w: bubble.offsetWidth + PAD * 2, h: bubble.offsetHeight + PAD * 2 });
  box.style.left = L.petLeft + 'px'; box.style.top = L.petTop + 'px';
  bubble.style.left = PAD + 'px';
  // 靠小日历那一边只留 8px，多出来的空让给另一边
  bubble.style.top = (L.above ? PAD * 2 - 8 : L.petTop + PH + 8) + 'px';
  bubble.style.setProperty('--from', L.above ? '6px' : '-6px');
  bubble.classList.add('on');
  bubble.querySelector('.x')?.addEventListener('click', hideBubble);
}
async function hideBubble() {
  if (!bubbleKind) return;
  bubbleKind = '';
  bubble.classList.remove('on');
  bubble.innerHTML = '';
  await window.pet.layout(null);
  box.style.left = box.style.top = '0px';
  render();
}
const head = (t, x = true) => `<div class="b-h"><b>${t}</b>${x ? '<button class="x" title="关闭">×</button>' : ''}</div>`;

function showMenu() {
  showBubble(head('把聊天里的文字拖给我') + statusHtml() +
    '<p class="hint">在微信、钉钉、QQ 里选中一段聊天，直接拖到我身上，我帮你找出作业、考试和活动。拖不动的话，先复制再点下面第一项。</p>' +
    '<div class="menu" style="margin-top:8px"><button data-a="clip">识别剪贴板里的文字</button><button data-a="open">打开河传答哒</button><button data-a="widget">显示 / 隐藏桌面小组件</button><button class="dim" data-a="hide">先藏起来</button></div>', 'menu');
  bubble.querySelector('[data-a=clip]').onclick = async () => {
    const t = (await window.pet.clipboard()).trim();
    if (!t) return say('剪贴板里没有文字', '先在聊天里选中一段，按 Ctrl+C 复制，再点我。', 'sad');
    recognize(t);
  };
  bubble.querySelector('[data-a=open]').onclick = () => { hideBubble(); window.pet.open(); };
  bubble.querySelector('[data-a=widget]').onclick = () => { hideBubble(); window.pet.toggleWidget(); };
  bubble.querySelector('[data-a=hide]').onclick = () => window.pet.hide();
}
// 一句话的提示：几秒后自己收起（鼠标停在气泡上就先不收）；face 为 null 时不换表情
let sayTimer = 0;
function say(title, text, face) {
  if (face) act(face, 2600);
  showBubble(head(esc(title)) + (text ? `<p class="hint">${esc(text)}</p>` : ''), 'say');
  clearTimeout(sayTimer);
  const later = () => { sayTimer = setTimeout(() => { if (bubbleKind !== 'say') return; bubble.matches(':hover') ? later() : hideBubble(); }, 5000); };
  later();
}

/* ---------- 识别 ---------- */
let busy = false, lastText = '', lastList = [];
async function recognize(text) {
  if (busy) return;
  busy = true; lastText = text;
  touch();
  setMode('think');
  showBubble(head('让我看看…', false) + `<p class="hint">正在从 ${text.length} 个字里找时间和事项</p>`, 'think');
  let r;
  try { r = await window.pet.recognize(text); } catch (e) { r = { ok: false, message: '出了点问题，再试一次吧' }; }
  busy = false;
  setMode('');
  if (!r || !r.ok) return say('没识别成', r && r.message, 'sad');
  lastList = r.list || [];
  if (!lastList.length) return say('这段里没找到带时间的事', '闲聊或者没说具体日期的消息，我就不记啦。', 'sad');
  act('happy', 2400);
  showBubble(head(`找到 ${lastList.length} 件事`) +
    (r.local ? `<p class="hint" style="margin:-4px 0 6px">${esc(r.why ? 'AI 暂时没连上，' : '')}先用本地规则找的，可能不全</p>` : '') +
    '<div class="list">' + lastList.map((c, i) => `<label class="item"><input type="checkbox" data-i="${i}" checked><div><div class="t">${esc(c.title)}</div><div class="w">${esc(c.label)}<span class="tag">${TYPE_NAME[c.type] || '活动'}</span></div></div></label>`).join('') + '</div>' +
    '<div class="acts"><button data-a="edit">打开改一改</button><button class="primary" data-a="add">加入日历</button></div>', 'result');
  bubble.querySelector('[data-a=add]').onclick = async () => {
    const pick = [...bubble.querySelectorAll('input[data-i]')].filter(x => x.checked).map(x => lastList[+x.dataset.i]);
    if (!pick.length) return say('一个都没勾', '', 'curious');
    const a = await window.pet.add(pick);
    if (!a || !a.ok) return say('没加进去', a && a.message, 'sad');
    say(a.n ? `加好啦，${a.n} 件事记进日历了` : '这些日历里已经有了', a.dup && a.n ? `另外 ${a.dup} 件之前就记过，没有重复加。` : '', a.n ? 'love' : 'wink');
  };
  bubble.querySelector('[data-a=edit]').onclick = () => { window.pet.open({ text: lastText, list: lastList }); hideBubble(); };
}

/* ---------- 拖文字过来 ---------- */
// 子元素之间移动也会触发 dragenter/leave，用计数判断是不是真的离开了窗口
let dragDepth = 0;
document.addEventListener('dragenter', e => { e.preventDefault(); if (dragDepth++ === 0 && !busy) { touch(); setMode('eat'); } });
document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; if (mode === 'eat') setMode(''); } });
document.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
document.addEventListener('drop', async e => {
  e.preventDefault();
  dragDepth = 0;
  if (mode === 'eat') setMode('');
  if (busy) return;
  const dt = e.dataTransfer;
  let text = dt.getData('text/plain') || dt.getData('text') || '';
  const f = dt.files && dt.files[0];
  if (!text && f) {
    if (/^text\/|\.(txt|csv|md)$/i.test(f.type + ' ' + f.name)) text = await f.text();
    else if (/^image\//.test(f.type)) return say('图片我还看不懂', '先在聊天里选中文字拖给我，或者复制文字后点我一下。', 'sad');
    else return say('这个文件我看不懂', '拖文字或者 .txt 文件给我就行。', 'sad');
  }
  text = text.trim();
  if (!text) return say('没接到文字', '选中聊天里的文字再拖过来试试。', 'curious');
  recognize(text);
});

/* ---------- 鼠标：放上去 / 按住拖动 / 单击 / 双击 ---------- */
box.onmouseenter = () => {
  const wasAsleep = baseState() === 'asleep';
  hover = true; touch();
  if (wasAsleep) act('yawn', 1800); else render();
};
box.onmouseleave = () => { hover = false; render(); };
let down = null, menuTimer = 0;
box.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  touch();
  down = { x: e.screenX, y: e.screenY, moved: false, lastX: e.screenX, dir: 0, flips: 0 };
  box.setPointerCapture(e.pointerId);
});
box.addEventListener('pointermove', e => {
  if (!down) return;
  if (!down.moved) {
    if (Math.abs(e.screenX - down.x) + Math.abs(e.screenY - down.y) < 4) return;
    down.moved = true;
    dragging = true; render();
    hideBubble().then(() => window.pet.dragStart());
    return;
  }
  // 来回甩：左右方向换了好几次就会晕
  const dx = e.screenX - down.lastX;
  if (Math.abs(dx) > 14) {
    const dir = Math.sign(dx);
    if (down.dir && dir !== down.dir) down.flips++;
    down.dir = dir; down.lastX = e.screenX;
  }
});
box.addEventListener('pointerup', () => {
  if (!down) return;
  const { moved, flips } = down;
  down = null;
  if (moved) {
    dragging = false;
    window.pet.dragEnd();
    return flips >= 4 ? act('dizzy', 2600) : act('boop', 260);
  }
  if (busy) return;
  act('boop', 220);
  // 等一下再开菜单：双击时就不开了
  clearTimeout(menuTimer);
  menuTimer = setTimeout(() => { if (bubbleKind === 'menu') hideBubble(); else showMenu(); }, 230);
});
box.addEventListener('dblclick', () => {
  clearTimeout(menuTimer);
  if (bubbleKind === 'menu') hideBubble();
  act('love', 2200);
});
box.addEventListener('contextmenu', e => { e.preventDefault(); if (!busy) showMenu(); });
// 点到别的窗口：菜单和提示收起来，识别结果留着
window.addEventListener('blur', () => { if (bubbleKind === 'menu' || bubbleKind === 'say') hideBubble(); });

// 跟主程序的外观设置走
window.pet.getTheme().then(t => document.documentElement.dataset.theme = t || 'light');
window.pet.onTheme(t => document.documentElement.dataset.theme = t || 'light');
render();
refreshStatus();
</script>
</body>
</html>
